apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-app
  template:
    metadata:
      labels:
        app: bank-app
    spec:
      containers:
      - name: bank-app
        image: alexvoke/bank-app:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000